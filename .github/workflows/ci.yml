name: STOP Vanthachu CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Lint, Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Static Code Analysis (flutter analyze)
        run: flutter analyze

      - name: Run Automated Test Matrix (flutter test)
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stop-vanthachu-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
